# ABOUTME: Project metadata, dependencies, and tooling config for the outreach agent.
# ABOUTME: Managed with uv; configures ruff (lint/format), pyright (types), and pytest.
[project]
name = "outreach-agent"
version = "0.1.0"
description = "A reference implementation of an autonomous, safety-gated B2B cold-outreach agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# The inbound responder is the one Agent SDK component. It is optional so the
# core pipeline stays lightweight; install with `.[agent]` to use it.
agent = [
    "claude-agent-sdk>=0.2",
]

[project.scripts]
outreach = "outreach_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/outreach_agent/py.typed" = "outreach_agent/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "evals"]
extraPaths = ["."]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# Tests and evals use pytest's dynamic decorators; relax the type rules that
# only fire on third-party untyped test helpers, keeping src/ strictly typed.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUntypedFunctionDecorator = false

[[tool.pyright.executionEnvironments]]
root = "evals"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUntypedFunctionDecorator = false

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "live: tests that call real LLM APIs (require ANTHROPIC_API_KEY, not run in CI)",
]
